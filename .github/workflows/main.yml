name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar
        run: |
          D=app/src/main
          mkdir -p app $D/java/com/ggtrick $D/assets $D/res/xml $D/res/values
          mv root_build.gradle build.gradle
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml $D/
          mv MainActivity.kt TrickService.kt $D/java/com/ggtrick/
          mv index.html $D/assets/
          mv accessibility_config.xml $D/res/xml/
          mv strings.xml $D/res/values/
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: GGTrick3-apk, path: app/build/outputs/apk/debug/app-debug.apk}
